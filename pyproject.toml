[project]
name = "learning-context-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jupyterlab>=4.6.2",
    "langchain-core>=1.5.3",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "tavily-python>=0.7.27",
    "trafilatura>=2.2.0",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
v2 = [
    "py-fsrs>=4.6",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
]
